<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14171d">
<title>Dragonscale Quests</title>
<style>
:root{
  --bg:#14171d; --panel:#1b1f27; --panel-2:#222732; --line:#2d333f;
  --fg:#e3e7ee; --muted:#939cad; --accent:#e0a84a; --accent-dim:#6b4f1d;
  --ok:#5fcf9e; --bad:#e8857a; --edit:#7aa2f7;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
/* An id selector setting display beats the [hidden] attribute, so say it louder.
   Without this, hiding the login gate leaves it covering the app. */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  overflow:hidden;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- gate ---------- */
#gate{
  position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;
  padding:max(20px,env(safe-area-inset-left));
}
#gate form{display:flex;flex-direction:column;gap:14px;width:min(360px,100%)}
#gate h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
#gate p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
#gate input{
  background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:12px 13px;font-family:var(--mono);font-size:.9rem;width:100%;
}
#gate input:focus{outline:2px solid var(--accent-dim);border-color:var(--accent)}
#gate button{background:var(--accent);color:#1a1405;border-radius:7px;padding:12px;font-weight:600}
#gateErr{color:var(--bad);font-size:.85rem;min-height:1.2em}

/* ---------- top bar ---------- */
header{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line);background:var(--panel);
}
header .brand{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
header .spacer{flex:1}
#status{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
#dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
#dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(95,207,158,.15)}
#dot.off{background:var(--bad)}
#dot.busy{background:var(--accent)}
#editToggle{
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;
  background:var(--panel-2);color:var(--muted);white-space:nowrap;
}
#editToggle[aria-pressed="true"]{background:var(--edit);border-color:var(--edit);color:#0d1424;font-weight:600}

#chapters{
  display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;
  padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line);background:var(--panel);
}
#chapters::-webkit-scrollbar{display:none}
#chapters button{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.85rem;white-space:nowrap;background:var(--panel-2);
}
#chapters button[aria-selected="true"]{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}

/* ---------- canvas ---------- */
main{flex:1;position:relative;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:var(--muted);font-size:.9rem;text-align:center;pointer-events:none;max-width:70%;
}
#tools{
  position:absolute;left:max(12px,env(safe-area-inset-left));display:flex;gap:8px;
  bottom:calc(14px + env(safe-area-inset-bottom));
}
#tools button{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;font-size:.86rem;box-shadow:0 2px 10px rgba(0,0,0,.35);
}
#tools button[aria-pressed="true"]{background:var(--edit);border-color:var(--edit);color:#0d1424;font-weight:600}
#banner{
  position:absolute;left:50%;transform:translateX(-50%);top:12px;
  background:var(--panel);border:1px solid var(--edit);border-radius:8px;
  padding:8px 14px;font-size:.84rem;box-shadow:0 2px 14px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:10px;max-width:92%;
}
#banner.bad{border-color:var(--bad);color:var(--bad)}
#banner button{color:var(--muted);font-size:1.1rem;line-height:1}

/* ---------- inspector ---------- */
/* A dialog over the map rather than a strip beside it: the inspector is where the
   work happens, and on a tablet a side panel left neither half usable. */
#panel{
  position:fixed;inset:0;z-index:55;display:flex;
  background:rgba(8,10,14,.66);
  opacity:0;pointer-events:none;transition:opacity .15s ease;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
#panel.open{opacity:1;pointer-events:auto}
#panel .sheet{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:min(460px,100%);max-height:100%;margin:auto;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  transform:translateY(10px);transition:transform .15s ease;
}
#panel.open .sheet{transform:none}
/* On a phone it is the whole screen; a dialog with 16px of map showing round the
   edge is just a dialog with less room in it. */
@media (max-width:640px){
  #panel{padding:0}
  #panel .sheet{
    width:100%;height:100%;max-height:none;border:none;border-radius:0;
    transform:translateY(16px);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
}
#panel header{background:none;border-bottom:1px solid var(--line);padding:12px 14px;align-items:flex-start}
#panel .body{
  overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
#panel h2{margin:0;font-size:1rem;line-height:1.3;min-width:0;word-break:break-word}
#panel h2 .sub{display:block;font-size:.72rem;color:var(--muted);font-family:var(--mono);font-weight:400;margin-top:3px}
#closePanel{color:var(--muted);font-size:1.4rem;line-height:1;padding:0 4px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field .val{font-family:var(--mono);font-size:.82rem;word-break:break-all}
.field .note{font-size:.72rem;color:var(--muted);line-height:1.4}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:8px 9px;width:100%;font-size:.88rem;
}
textarea{font-family:var(--mono);font-size:.8rem;line-height:1.45;resize:vertical;min-height:62px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{opacity:.55}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem}
.check input{width:16px;height:16px;accent-color:var(--edit);flex:none}
.bad{color:var(--bad);font-size:.75rem}

details{border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
details>summary{
  padding:9px 11px;font-size:.84rem;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px;
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"\25be";margin-left:auto;color:var(--muted);font-size:.8rem}
details[open]>summary::after{content:"\25b4"}
details>summary .count{color:var(--muted);font-size:.76rem;font-family:var(--mono)}
details .inner{padding:0 11px 11px;display:flex;flex-direction:column;gap:11px}

.item{
  display:flex;align-items:center;gap:9px;background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;text-align:left;
}
.item>img{width:26px;height:26px;image-rendering:pixelated;flex:none}
.item .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;text-align:left}
.item .t b{font-size:.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:.71rem;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 5px;flex:none}
.item .x:hover{color:var(--bad)}
.item.dep:hover{border-color:var(--accent)}
.pill{
  display:inline-grid;place-items:center;width:26px;height:26px;flex:none;
  font-size:.68rem;font-family:var(--mono);border-radius:4px;
  background:var(--accent-dim);color:var(--accent);
}
.btn{border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:.84rem;background:var(--panel-2)}
.btn:hover:enabled{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover:enabled{border-color:var(--bad);color:var(--bad)}
.btn.go{background:var(--edit);border-color:var(--edit);color:#0d1424;font-weight:600}
.btn.go:hover:enabled{color:#0d1424}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- item picker ---------- */
#picker,#history{
  position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.82);display:flex;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.box{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;
  width:min(640px,100%);max-height:100%;margin:auto;
}
.box .top{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
#pickerGrid{
  overflow-y:auto;padding:10px;display:grid;gap:6px;
  grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
}
#pickerGrid button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px;
  border-radius:7px;border:1px solid transparent;
}
#pickerGrid button:hover{border-color:var(--accent);background:var(--panel-2)}
#pickerGrid img{width:32px;height:32px;image-rendering:pixelated}
#pickerGrid span{font-size:.62rem;color:var(--muted);text-align:center;line-height:1.2;word-break:break-all}
#pickerCount{padding:0 12px 10px;font-size:.75rem;color:var(--muted)}

/* ---------- history ---------- */
#histList{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.commit{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg);
}
.commit .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.commit .t b{font-size:.84rem;font-weight:600}
.commit .t span{font-size:.71rem;color:var(--muted);font-family:var(--mono)}
.commit.now{border-color:var(--accent)}
#histNote{padding:0 12px 10px;font-size:.75rem;color:var(--muted);line-height:1.45}

/* ---------- context menu ---------- */
#menu{position:fixed;inset:0;z-index:58}
#menu .items{
  position:absolute;min-width:215px;max-width:min(300px,92vw);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 14px 40px rgba(0,0,0,.55);
}
#menu .who{
  padding:7px 10px 8px;font-size:.73rem;color:var(--muted);
  border-bottom:1px solid var(--line);margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#menu button{
  display:block;width:100%;text-align:left;padding:10px 11px;border-radius:7px;
  font-size:.88rem;
}
#menu button:hover{background:var(--panel-2)}
#menu button.danger:hover{background:rgba(232,133,122,.14);color:var(--bad)}
/* On a phone it comes up from the bottom, where a thumb is. */
@media (max-width:640px){
  #menu{background:rgba(8,10,14,.5)}
  #menu .items{
    left:0;right:0;bottom:0;top:auto!important;max-width:none;
    border-radius:14px 14px 0 0;border-left:none;border-right:none;border-bottom:none;
    padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  }
  #menu button{padding:14px 12px;font-size:.95rem}
  #menu .who{padding:10px 12px 12px;font-size:.8rem}
}

/* ---------- picker: grouped by mod ---------- */
.box .top{flex-wrap:wrap}
#pickerSearch{flex:1 1 180px;min-width:0}
#pickerMod{flex:0 1 190px;min-width:0}
.modhead{
  grid-column:1/-1;display:flex;align-items:baseline;gap:8px;
  padding:10px 4px 3px;font-size:.78rem;font-weight:600;
  border-bottom:1px solid var(--line);margin-bottom:2px;
}
.modhead span{font-size:.7rem;color:var(--muted);font-family:var(--mono);font-weight:400}
.modhead:first-child{padding-top:2px}
.dangerzone{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);display:flex}
/* Touch targets: 44px is the number every platform guideline lands on, and a
   delete sitting next to a tap-to-open row is exactly where a near miss hurts. */
@media (pointer:coarse){
  .item{padding:10px}
  .item .x{padding:8px 10px;font-size:1.25rem}
  .btn{padding:12px 14px}
  details>summary{padding:13px 11px}
  #pickerGrid.aslist button{padding:14px 10px}
}
.dangerzone .btn{flex:1;color:var(--bad);border-color:rgba(232,133,122,.35)}
.idrow{display:flex;gap:6px;align-items:stretch}
.idrow input{flex:1;min-width:0}
.idrow .btn{flex:none;white-space:nowrap}
#pickerTitle{align-self:center;white-space:nowrap;font-size:.95rem}
#pickerGrid button.current{border-color:var(--accent);background:var(--accent-dim)}
/* Without icons it is a list, not a grid: ids are long and a tile would clip them. */
#pickerGrid.aslist{grid-template-columns:1fr;gap:3px}
#pickerGrid.aslist button{
  flex-direction:row;align-items:baseline;gap:9px;
  padding:11px 10px;border:1px solid transparent;text-align:left;
}
#pickerGrid.aslist button b{font-size:.88rem;font-weight:500}
#pickerGrid.aslist button span{font-size:.72rem;color:var(--muted);text-align:left}
#pickerGrid.aslist .modhead{padding:12px 4px 4px}
/* ---------- item browser ---------- */
#browse{
  position:fixed;inset:0;z-index:59;background:rgba(8,10,14,.82);display:flex;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.box.wide{width:min(900px,100%);height:min(720px,100%);max-height:100%}
#browseTitle{align-self:center;white-space:nowrap;font-size:.95rem}
#browseSearch{flex:1 1 180px;min-width:0}
#browseMod{flex:0 1 190px;min-width:0}
#browseBody{overflow-y:auto;flex:1;padding:10px}
#browseCount{padding:0 12px 10px;font-size:.75rem;color:var(--muted)}
#browseGrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
#browseGrid button{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 5px;
  border-radius:8px;border:1px solid transparent;
}
#browseGrid button:hover{border-color:var(--accent);background:var(--panel-2)}
#browseGrid img{width:36px;height:36px;image-rendering:pixelated}
#browseGrid b{font-size:.74rem;font-weight:500;text-align:center;line-height:1.25}
#browseGrid span{font-size:.62rem;color:var(--muted);text-align:center;word-break:break-all}

/* the detail view */
.detail{display:flex;flex-direction:column;gap:14px}
.detail .hero{display:flex;align-items:center;gap:14px}
.detail .hero img{width:56px;height:56px;image-rendering:pixelated;flex:none}
.detail .hero h3{margin:0;font-size:1.15rem;line-height:1.25}
.detail .hero .id{font-family:var(--mono);font-size:.76rem;color:var(--muted);word-break:break-all}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap}
.detail h4{
  margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
}
/* Recipes are drawn on Minecraft's own slot and arrow textures, pulled out of
   the client jar by tools/icons/build-ui.mjs. The surrounding panel stays dark
   like the rest of the editor, which is how JEI looks over a dark background. */
.recipe{
  --slot:34px;
  display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
}
.recipe .kind{
  font-size:.66rem;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);
  padding:3px 6px;border-radius:4px;flex:none;margin-top:9px;
}
.recipe .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.recipe .side{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.recipe .mid{display:flex;align-items:center;gap:5px;flex:none}
.recipe .grid{display:grid;gap:2px}
.recipe .none{font-size:.76rem;color:var(--muted)}

.recipe .slot{
  position:relative;width:var(--slot);height:var(--slot);flex:none;padding:0;
  background:url('/icons/ui/slot.png') center/100% 100% no-repeat;
  image-rendering:pixelated;border:none;
}
.recipe .slot:hover:not(:disabled){filter:brightness(1.25)}
.recipe .slot.blank{background-image:none;background:rgba(255,255,255,.03);border-radius:3px}
.recipe .slot>img{
  position:absolute;inset:14%;width:72%;height:72%;image-rendering:pixelated;
}
.recipe .slot .pill{position:absolute;inset:18%;width:64%;height:64%}
.recipe .slot .more,
.recipe .slot .count,
.recipe .slot .chance{
  position:absolute;font-size:.56rem;font-family:var(--mono);line-height:1;
  padding:1px 2px;border-radius:2px;background:rgba(12,14,19,.88);
}
.recipe .slot .more{right:1px;top:1px;color:var(--muted)}
.recipe .slot .count{right:1px;bottom:1px;color:var(--fg)}
.recipe .slot .chance{left:1px;bottom:1px;color:var(--accent)}
.recipe .slot.fluid{
  background:linear-gradient(#2b4668,#1d3047);border-radius:3px;
  display:grid;place-items:center;
}
.recipe .slot .fl{font-size:.52rem;text-align:center;color:#9ec3ef;padding:2px;word-break:break-all}

.recipe .arrow{width:30px;height:21px;image-rendering:pixelated;flex:none;opacity:.85}
.recipe .flame{width:14px;height:14px;image-rendering:pixelated;flex:none}
.recipe .meta{font-size:.7rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}

/* a sequenced assembly is a list of steps, not a row */
.recipe .sequence{display:flex;flex-direction:column;gap:5px;width:100%}
.recipe .step{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.recipe .step .kind{margin-top:0}

.rawrecipe{flex-basis:100%;background:none;border:none;border-radius:0}
.rawrecipe>summary{padding:4px 0;font-size:.7rem;color:var(--muted)}
.rawrecipe pre{
  margin:0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;font-size:.68rem;line-height:1.4;overflow-x:auto;
  color:var(--muted);max-height:260px;
}
@media (max-width:640px){ .recipe{--slot:30px} }
.modcard{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  display:flex;flex-direction:column;gap:5px;
}
.modcard .mhead{display:flex;align-items:baseline;gap:8px}
.modcard b{font-size:.9rem}
.modcard .mid{font-size:.7rem;font-family:var(--mono);color:var(--muted)}
.modcard .faint{color:var(--muted)}
.modcard .small{font-size:.74rem}
.modcard .mlinks{display:flex;flex-wrap:wrap;gap:10px}
.modcard details{border:none;background:none}
.modcard details>summary{padding:4px 0;font-size:.72rem;color:var(--muted)}
.modcard details .inner{padding:8px 0 0}
.modcard p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.5}
.modcard a{font-size:.74rem;color:var(--accent);font-family:var(--mono);text-decoration:none;word-break:break-all}
.modcard a:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{
  font-size:.68rem;font-family:var(--mono);padding:3px 7px;border-radius:999px;
  background:var(--bg);border:1px solid var(--line);color:var(--muted);
}
.detail .field textarea{min-height:70px}
.detail .empty{font-size:.82rem;color:var(--muted)}
@media (max-width:640px){
  #browse{padding:0}
  .box.wide{width:100%;height:100%;border-radius:0;border:none}
  #browseGrid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
}
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gateForm">
    <h1>Dragonscale Quests</h1>
    <p>Paste the token from <code>config/questbridge.properties</code> on the server. It is remembered on this device.</p>
    <input id="token" type="password" placeholder="token" autocomplete="current-password" spellcheck="false">
    <button type="submit">Connect</button>
    <div id="gateErr"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <span class="brand">Dragonscale</span>
    <span class="spacer"></span>
    <button id="browseOpen" class="btn">Items</button>
    <button id="histOpen" class="btn">History</button>
    <button id="editToggle" aria-pressed="false">Editing off</button>
    <span id="status"><span id="dot"></span><span id="statusText">connecting</span></span>
  </header>
  <nav id="chapters"></nav>
  <main>
    <canvas id="map"></canvas>
    <div id="hint" hidden></div>
    <div id="banner" hidden><span id="bannerText"></span><button id="bannerX" aria-label="Dismiss">&times;</button></div>
    <div id="tools" hidden>
      <button id="addQuest" aria-pressed="false">+ Quest</button>
    </div>
  </main>
  <aside id="panel" role="dialog" aria-modal="true">
    <div class="sheet">
      <header>
        <h2 id="qTitle">Quest</h2>
        <span class="spacer"></span>
        <button id="closePanel" aria-label="Close">&times;</button>
      </header>
      <div class="body" id="qBody"></div>
    </div>
  </aside>
</div>

<div id="picker" hidden>
  <div class="box">
    <div class="top">
      <strong id="pickerTitle">Choose</strong>
      <input id="pickerSearch" type="text" placeholder="Search&hellip;" spellcheck="false" autocomplete="off">
      <select id="pickerMod"></select>
      <button class="btn" id="pickerCancel">Cancel</button>
    </div>
    <div id="pickerGrid"></div>
    <div id="pickerCount"></div>
  </div>
</div>

<div id="browse" hidden>
  <div class="box wide">
    <div class="top">
      <button class="btn" id="browseBack" hidden>&larr;</button>
      <strong id="browseTitle">Items</strong>
      <input id="browseSearch" type="text" placeholder="Search by name or id&hellip;" spellcheck="false" autocomplete="off">
      <select id="browseMod"></select>
      <button class="btn" id="browseClose">Close</button>
    </div>
    <div id="browseBody"></div>
    <div id="browseCount"></div>
  </div>
</div>

<div id="menu" hidden><div class="items"></div></div>

<div id="history" hidden>
  <div class="box">
    <div class="top">
      <strong style="flex:1;align-self:center">History</strong>
      <button class="btn" id="histClose">Close</button>
    </div>
    <div id="histList"></div>
    <div id="histNote"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const TOKEN_KEY = 'dragonscale.token';

/** The quest shapes FTB ships, from its own texture folder. "" means chapter default. */
const SHAPES = ['', 'circle', 'square', 'rsquare', 'diamond', 'hexagon', 'octagon',
                'pentagon', 'gear', 'heart', 'none'];
/** The grid FTB's own editor snaps to. */
const SNAP = 0.5;

const S = {
  token: null,
  book: null,
  types: { tasks: {}, rewards: {} },
  icons: {},
  chapterId: null,
  sel: null,
  edit: false,
  placing: false,
  linking: false,
  live: false,
  saving: 0,
  open: new Set(['tasks', 'rewards', 'raw', 'item']),
  registries: {},          // registry name -> ids, fetched once and kept
  names: {},               // item id -> the name a human would use
  items: null,             // the server's item registry, fetched on first browse
  mods: {},                // mod id -> what its author says it is
  notes: {},               // item id -> what it is, as written here
};
const view = { x: 0, y: 0, scale: 48 };    // world units -> px

// ---------------------------------------------------------------- transport --

class ApiError extends Error {
  constructor(status, body) {
    super(body && body.error ? body.error : 'HTTP ' + status);
    this.status = status;
  }
}

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + S.token }
  });
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) throw new ApiError(r.status, body);
  return body;
}

/**
 * Sends a batch of edits. The book carries a version, and the server rejects a
 * batch built on a stale one rather than letting it overwrite what it never saw —
 * that is what stops a tablet stomping a rename someone made in game seconds ago.
 *
 * A rejection is retried exactly once against fresh data. These edits are
 * field-level, so replaying them is last-write-wins per field, which is the right
 * granularity; retrying forever would not be.
 */
async function send(edits, retried = false) {
  if (!edits.length) return null;
  S.saving++; status();
  try {
    const res = await api('/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ baseVersion: S.book.version, edits })
    });
    // Adopt the new version straight away: waiting for the change feed to tell us
    // would make a quick second edit arrive stale and need a pointless retry.
    // Then resync shortly after, because the local copy was changed optimistically
    // and the server is the one that decides what a value became.
    if (res && res.version) S.book.version = res.version;
    resyncSoon();
    return res;
  } catch (e) {
    if (e.status === 409 && !retried) {
      await reload().catch(() => {});
      return send(edits, true);
    }
    // The optimistic local change is now a lie. The truth is on the server.
    banner(e.message || 'The edit was refused.', true);
    await reload().catch(() => {});
    return null;
  } finally {
    S.saving--; status();
  }
}

function status() {
  const dot = $('#dot'), text = $('#statusText');
  if (S.saving) { dot.className = 'busy'; text.textContent = 'saving'; return; }
  dot.className = S.live ? 'live' : 'off';
  text.textContent = S.live ? 'v' + (S.book ? S.book.version : '?') : 'offline';
}

let bannerTimer = null;
/** `sticky` for a message that describes a mode you are still in. */
function banner(msg, bad = false, sticky = false) {
  $('#bannerText').textContent = msg;
  $('#banner').classList.toggle('bad', bad);
  $('#banner').hidden = false;
  clearTimeout(bannerTimer);
  if (!bad && !sticky) bannerTimer = setTimeout(() => { $('#banner').hidden = true; }, 3200);
}
$('#bannerX').onclick = () => {
  if (S.linking) { endLinking(); return; }    // the banner is the way out of the mode
  $('#banner').hidden = true;
};

// -------------------------------------------------------------------- start --

try { S.token = localStorage.getItem(TOKEN_KEY); } catch {}

// A token in the link beats a token typed on a tablet. Send someone
// http://host:25580/#token=… and they are in; the hash is dropped from the bar
// straight afterwards so it does not sit in screenshots or history.
// Any token the properties file can hold, not just the hex one the bridge
// generates — someone is eventually going to set their own.
const linked = /(?:^|[#&])token=([^&\s]+)/.exec(location.hash || '');
if (linked) {
  S.token = decodeURIComponent(linked[1]);
  try { history.replaceState(null, '', location.pathname); } catch {}
}

if (S.token) connect(S.token); else $('#gate').hidden = false;

$('#gateForm').addEventListener('submit', e => {
  e.preventDefault();
  connect($('#token').value.trim());
});

async function connect(t) {
  S.token = t;
  $('#gateErr').textContent = '';
  try {
    await api('/health');
  } catch (err) {
    $('#gate').hidden = false;
    $('#gateErr').textContent = err.status === 401
      ? 'That token was rejected.'
      : 'Could not reach the server.';
    return;
  }
  try { localStorage.setItem(TOKEN_KEY, S.token); } catch {}
  $('#gate').hidden = true;
  $('#app').hidden = false;
  await first();
  listen();
}

async function first() {
  const [book, types, idx, nm, md] = await Promise.all([
    api('/book'),
    api('/types').catch(() => ({ tasks: {}, rewards: {} })),
    fetch('/icons/index.json').then(r => r.ok ? r.json() : { icons: {} }).catch(() => ({ icons: {} })),
    fetch('/icons/names.json').then(r => r.ok ? r.json() : { names: {} }).catch(() => ({ names: {} })),
    fetch('/icons/mods.json').then(r => r.ok ? r.json() : { mods: {} }).catch(() => ({ mods: {} }))
  ]);
  S.book = book;
  S.types = types && types.tasks ? types : { tasks: {}, rewards: {} };
  S.icons = idx.icons || {};
  S.names = nm.names || {};
  S.mods = md.mods || {};
  if (!S.chapterId) S.chapterId = (chapters()[0] || {}).id || null;
  renderChapters();
  fitView();
  drawMap();
  status();
  // Warm the item list in the background: both the picker and the browser want
  // it, and neither should pause the first time it is opened.
  loadItems().catch(() => {});
  api('/notes').then(n => { S.notes = n.notes || {}; }).catch(() => {});
}

/**
 * Refetches the book without disturbing what the user is doing: the camera stays
 * put, the selection survives, and the inspector is left alone while a field in it
 * has focus. An editor that scrolled away from you on every remote change would be
 * unusable with two people working at once.
 */
async function reload() {
  S.book = await api('/book');
  if (!chapters().some(c => c.id === S.chapterId)) S.chapterId = (chapters()[0] || {}).id || null;
  renderChapters();
  drawMap();
  if (!panelHasFocus()) renderPanel();
  status();
}

let resyncTimer = null;
/** Debounced, so a run of keystroke-sized edits costs one refetch, not five. */
function resyncSoon() {
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(() => {
    if (!S.saving) reload().catch(() => {});
  }, 500);
}

/**
 * Only a field being typed into is worth protecting from a re-render. A focused
 * button is not — and after clicking a task's delete the focus sat on that very
 * button, so this reported "busy" and the list never refreshed to show it gone.
 */
const panelHasFocus = () => {
  const a = document.activeElement;
  return !!a && a !== document.body && $('#panel').contains(a)
    && a.matches('input, textarea, select');
};

function listen() {
  const es = new EventSource('/api/changes?token=' + encodeURIComponent(S.token));
  es.onopen = () => { S.live = true; status(); };
  es.onerror = () => { S.live = false; status(); };
  es.onmessage = e => {
    S.live = true;
    let msg = null;
    try { msg = JSON.parse(e.data); } catch { return; }
    // Every applied edit is announced, our own included, so one refetch path
    // serves both and there is no second code path to keep correct.
    if (msg.version && S.book && msg.version !== S.book.version) reload().catch(() => {});
    else status();
  };
}

// ----------------------------------------------------------------- the book --

const chapters = () => (S.book && S.book.chapterGroups || []).flatMap(g => g.chapters || []);
const chapter = () => chapters().find(c => c.id === S.chapterId) || null;
const quests = () => (chapter() || {}).quests || [];

function byId(id) {
  for (const c of chapters()) {
    if (c.id === id) return { kind: 'chapter', obj: c };
    for (const q of c.quests || []) {
      if (q.id === id) return { kind: 'quest', obj: q, chapter: c };
      for (const t of q.tasks || []) if (t.id === id) return { kind: 'task', obj: t, quest: q };
      for (const r of q.rewards || []) if (r.id === id) return { kind: 'reward', obj: r, quest: q };
    }
  }
  return null;
}
const selected = () => (S.sel ? byId(S.sel) : null);

const num = (v, dflt = 0) => {
  const n = typeof v === 'number' ? v : Number(v);
  return Number.isFinite(n) ? n : dflt;
};
const qx = q => num(q.data && q.data.x, 0);
const qy = q => num(q.data && q.data.y, 0);
const qsize = q => num(q.data && q.data.size, 1) || 1;
const qshape = q => (q.data && q.data.shape)
  || ((chapter() || {}).data || {}).default_quest_shape || 'circle';
const deps = q => (q.data && q.data.dependencies) || [];
const titleOf = o => (o && o.text && (o.text.title || o.text.rawTitle)) || '';

function renderChapters() {
  const nav = $('#chapters');
  nav.innerHTML = '';
  for (const c of chapters()) {
    const b = document.createElement('button');
    b.textContent = titleOf(c) || (c.data || {}).filename || c.id;
    b.setAttribute('aria-selected', c.id === S.chapterId);
    b.onclick = () => {
      S.chapterId = c.id;
      S.sel = null; closePanel();
      renderChapters(); fitView(); drawMap();
    };
    nav.appendChild(b);
  }
  const n = quests().length;
  $('#hint').hidden = n > 0;
  if (!n) {
    $('#hint').textContent = chapters().length
      ? (S.edit ? 'Empty chapter. Tap “+ Quest”, then tap the map.' : 'No quests in this chapter.')
      : 'No chapters in the book yet.';
  }
}

// --------------------------------------------------------------------- icons --

/**
 * A task's own icon wins over its item: an item task often points at
 * ftbfiltersystem:smart_filter, which carries the match expression and has no
 * meaningful icon, so FTB stores the display icon on the task itself.
 */
function taskIconId(t) {
  const d = (t && t.data) || {};
  const tries = [d.icon && d.icon.id, d.item && d.item.id,
                 typeof d.item === 'string' ? d.item : null];
  for (const id of tries) {
    // ftbquests:custom_icon is a placeholder whose real picture is a texture path
    // in its components, and a texture path has no item id to look up. Keep going.
    if (id && id !== 'ftbquests:custom_icon' && S.icons[id]) return id;
  }
  return null;
}

function questIconId(q) {
  const own = q.data && q.data.icon && q.data.icon.id;
  if (own && own !== 'ftbquests:custom_icon' && S.icons[own]) return own;
  for (const t of q.tasks || []) {
    const id = taskIconId(t);
    if (id) return id;
  }
  return null;
}

const imgCache = new Map();
function imageFor(id) {
  if (!id || !S.icons[id]) return null;
  if (imgCache.has(id)) return imgCache.get(id);
  const img = new Image();
  img.onload = drawMap;
  img.src = '/icons/' + S.icons[id].file;
  imgCache.set(id, img);
  return img;
}

// -------------------------------------------------------------------- canvas --

const cv = $('#map'), ctx = cv.getContext('2d');

function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, r.width * dpr);
  cv.height = Math.max(1, r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(() => { resize(); drawMap(); }).observe($('main'));

function fitView() {
  const qs = quests();
  const r = cv.getBoundingClientRect();
  if (!qs.length) { view.x = r.width / 2; view.y = r.height / 2; view.scale = 48; return; }
  const xs = qs.map(qx), ys = qs.map(qy);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 1.5;
  const sx = r.width / ((maxX - minX) + pad * 2 || 1);
  const sy = r.height / ((maxY - minY) + pad * 2 || 1);
  view.scale = Math.max(16, Math.min(90, Math.min(sx, sy)));
  view.x = r.width / 2 - ((minX + maxX) / 2) * view.scale;
  view.y = r.height / 2 - ((minY + maxY) / 2) * view.scale;
}

const toScreen = (x, y) => [x * view.scale + view.x, y * view.scale + view.y];
const toWorld = (px, py) => [(px - view.x) / view.scale, (py - view.y) / view.scale];
const snap = v => Math.round(v / SNAP) * SNAP;

/** Shape outlines, as polygons wherever FTB uses one. */
function shapePath(shape, x, y, rad) {
  ctx.beginPath();
  const poly = n => {
    // Flat-topped, which is how FTB draws its hexagons and octagons.
    const turn = Math.PI / 2 + (n % 2 ? 0 : Math.PI / n);
    for (let i = 0; i < n; i++) {
      const a = turn + i * 2 * Math.PI / n;
      const px = x + Math.cos(a) * rad, py = y - Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  };
  switch (shape) {
    case 'square': ctx.rect(x - rad, y - rad, rad * 2, rad * 2); break;
    case 'rsquare': ctx.roundRect(x - rad, y - rad, rad * 2, rad * 2, rad * 0.28); break;
    case 'diamond': poly(4); break;
    case 'pentagon': poly(5); break;
    case 'hexagon': poly(6); break;
    case 'octagon': poly(8); break;
    // gear and heart are drawn as circles: the editor needs each quest located and
    // sized, not its silhouette reproduced.
    default: ctx.arc(x, y, rad, 0, Math.PI * 2);
  }
}

function drawMap() {
  resize();
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  const qs = quests();

  if (S.edit) drawGrid(r);
  if (!qs.length) return;
  const index = Object.fromEntries(qs.map(q => [q.id, q]));

  // In dependency mode the map has to answer "what is linked right now", or you
  // are toggling blind.
  const wiring = S.linking && index[S.sel] ? index[S.sel] : null;
  const wired = wiring ? new Set(deps(wiring)) : null;

  // Dependency edges first, so nodes sit on top.
  ctx.lineWidth = Math.max(1, view.scale / 26);
  for (const q of qs) {
    const [x2, y2] = toScreen(qx(q), qy(q));
    const mine = wiring && q.id === wiring.id;
    for (const d of deps(q)) {
      const p = index[d];
      if (!p) continue;
      const [x1, y1] = toScreen(qx(p), qy(p));
      ctx.strokeStyle = mine ? '#5fcf9e' : wiring ? '#2b313c' : '#39414f';
      ctx.lineWidth = mine ? Math.max(2, view.scale / 16) : Math.max(1, view.scale / 26);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  for (const q of qs) {
    const [x, y] = toScreen(qx(q), qy(q));
    const rad = (view.scale * 0.42) * qsize(q);
    if (x + rad < -40 || x - rad > r.width + 40 || y + rad < -40 || y - rad > r.height + 40) continue;
    const isSel = S.sel === q.id;
    const isSubject = wiring && q.id === wiring.id;
    const isWired = wired && wired.has(q.id);

    // Fade everything that is not part of the question being asked.
    ctx.globalAlpha = wiring && !isSubject && !isWired ? 0.45 : 1;

    shapePath(qshape(q), x, y, rad);
    ctx.fillStyle = isSubject ? '#1e2a3d' : isWired ? '#1e3028' : isSel ? '#3a3524' : '#242a35';
    ctx.fill();
    ctx.strokeStyle = isSubject ? '#7aa2f7' : isWired ? '#5fcf9e' : isSel ? '#e0a84a' : '#39414f';
    ctx.lineWidth = isSubject || isWired ? 3 : isSel ? 2.5 : 1.5;
    ctx.stroke();

    const img = imageFor(questIconId(q));
    if (img && img.complete && img.naturalWidth) {
      const s = rad * 1.15;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
    }
    // Labels only once there is room. Quest grids are dense, and drawing every
    // title at low zoom turns the map into unreadable overlapping text.
    const label = titleOf(q);
    if (view.scale > 46 && label) {
      ctx.font = '11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      const short = label.length > 20 ? label.slice(0, 19) + '…' : label;
      const w = ctx.measureText(short).width;
      ctx.fillStyle = 'rgba(20,23,29,.82)';
      ctx.fillRect(x - w / 2 - 3, y + rad + 4, w + 6, 14);
      ctx.fillStyle = isSel ? '#e0a84a' : '#aab3c2';
      ctx.fillText(short, x, y + rad + 14);
    }
  }
  ctx.globalAlpha = 1;      // the context outlives the frame
}

function drawGrid(r) {
  const step = view.scale * SNAP;
  if (step < 7) return;
  ctx.strokeStyle = 'rgba(122,162,247,.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = view.x % step; x < r.width; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, r.height); }
  for (let y = view.y % step; y < r.height; y += step) { ctx.moveTo(0, y); ctx.lineTo(r.width, y); }
  ctx.stroke();
}

function questAt(px, py) {
  // Last first: later quests are drawn on top, so they should be hit first.
  const qs = quests();
  for (let i = qs.length - 1; i >= 0; i--) {
    const q = qs[i];
    const [x, y] = toScreen(qx(q), qy(q));
    const rad = (view.scale * 0.42) * qsize(q);
    if (Math.abs(px - x) <= rad + 3 && Math.abs(py - y) <= rad + 3) return q;
  }
  return null;
}

// -------------------------------------------------------- pan, zoom and drag --

let gesture = null;
const pointers = new Map();

cv.addEventListener('pointerdown', e => {
  // Only the primary button is a gesture. Letting the right button through here
  // selected the quest on pointerup, which put the dialog over the canvas before
  // the contextmenu event arrived — so the browser's own menu showed instead of
  // ours, and the quest opened as well.
  if (e.button > 0) return;
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size !== 1) return;

  const r = cv.getBoundingClientRect();
  const hit = questAt(e.clientX - r.left, e.clientY - r.top);

  // In edit mode a press on a quest moves it; anywhere else pans. Moving a node
  // and panning the map share one gesture, so they must not be ambiguous.
  if (S.edit && hit && !S.linking && !S.placing) {
    gesture = { kind: 'node', q: hit, moved: false,
                ox: qx(hit), oy: qy(hit), sx: e.clientX, sy: e.clientY };
  } else {
    gesture = { kind: 'pan', moved: false, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  }
});

cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2) {                                   // pinch
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (gesture && gesture.pinch) {
      const r = cv.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, dist / gesture.pinch);
    }
    gesture = { kind: 'pan', pinch: dist, moved: true };
    drawMap();
    return;
  }
  if (!gesture) return;
  const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
  if (Math.hypot(dx, dy) > 4) gesture.moved = true;

  if (gesture.kind === 'node') {
    if (!gesture.moved) return;
    gesture.q.data.x = snap(gesture.ox + dx / view.scale);
    gesture.q.data.y = snap(gesture.oy + dy / view.scale);
  } else {
    view.x = gesture.vx + dx;
    view.y = gesture.vy + dy;
  }
  drawMap();
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;     // a button we never took down
  const g = gesture;
  pointers.delete(e.pointerId);
  if (pointers.size) return;
  gesture = null;
  if (!g) return;

  if (g.kind === 'node' && g.moved) {
    // The local book already moved; tell the server where it landed. Two ops in
    // one batch so they share a single history entry, with an explicit type: FTB
    // stores these as doubles, and a bare 2 would go back as an int.
    const t = g.q.id;
    send([
      { op: 'set', target: t, path: 'data.x', value: g.q.data.x, type: 'double' },
      { op: 'set', target: t, path: 'data.y', value: g.q.data.y, type: 'double' }
    ]);
    if (S.sel === t && !panelHasFocus()) renderPanel();
    return;
  }
  if (!g.moved) tap(e);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function zoomAt(px, py, k) {
  const next = Math.max(8, Math.min(160, view.scale * k));
  const r = next / view.scale;
  view.x = px - (px - view.x) * r;
  view.y = py - (py - view.y) * r;
  view.scale = next;
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  drawMap();
}, { passive: false });

// --------------------------------------------------------- tap: select, add --

function tap(e) {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = questAt(px, py);

  if (S.linking) {
    if (!hit) endLinking();
    else if (hit.id !== S.sel) toggleDependency(hit.id);
    else banner('That is the quest you are wiring up. Tap another one.', false, true);
    return;
  }
  if (S.placing && !hit) {
    const [wx, wy] = toWorld(px, py);
    createQuest(snap(wx), snap(wy));
    return;
  }
  if (hit) {
    // A finger has no second button, so a tap offers the actions a right-click
    // would. A mouse opens the quest, because that is what a click already meant.
    if (e.pointerType === 'touch') openMenu(hit, e.clientX, e.clientY);
    else select(hit.id);
    return;
  }
  S.sel = null; closePanel(); drawMap();
}

cv.addEventListener('contextmenu', e => {
  const r = cv.getBoundingClientRect();
  const hit = questAt(e.clientX - r.left, e.clientY - r.top);
  if (!hit) return;                       // let the browser menu through elsewhere
  e.preventDefault();
  openMenu(hit, e.clientX, e.clientY);
});

// ------------------------------------------------------------- quest menu --

const closeMenu = () => { $('#menu').hidden = true; };
// pointerdown, not click: a right-click fires no click event, so the menu stayed
// up and its full-screen scrim swallowed the next right-click on the map.
$('#menu').addEventListener('pointerdown', e => { if (e.target.id === 'menu') closeMenu(); });
addEventListener('resize', closeMenu);

function openMenu(q, cx, cy) {
  const box = $('#menu').firstElementChild;
  box.innerHTML = '';

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = titleOf(q) || 'Untitled quest';
  box.append(who);

  const act = (label, fn, cls) => {
    const b = document.createElement('button');
    b.className = cls || '';
    b.textContent = label;
    b.onclick = () => { closeMenu(); fn(); };
    box.append(b);
  };

  act('Open…', () => select(q.id));
  if (S.edit) {
    const n = deps(q).length;
    act('Dependencies' + (n ? ' (' + n + ')' : '') + '…', () => startLinking(q.id, false));
    act('Duplicate', () => duplicateQuest(q));
    act('Delete', () => {
      if (!window.confirm('Delete “' + (titleOf(q) || q.id) + '” and its tasks?')) return;
      if (S.sel === q.id) { S.sel = null; closePanel(); }
      send([{ op: 'delete', target: q.id }]);
    }, 'danger');
  }

  $('#menu').hidden = false;
  // Only positioned on a wide screen; the phone layout pins it to the bottom.
  if (innerWidth > 640) {
    const r = box.getBoundingClientRect();
    box.style.left = Math.min(cx, innerWidth - r.width - 8) + 'px';
    box.style.top = Math.min(cy, innerHeight - r.height - 8) + 'px';
  } else {
    box.style.left = box.style.top = '';
  }
}

/**
 * A quest and everything in it. Quest books are full of near-identical quests —
 * ten item tasks that differ by one id — and rebuilding one by hand is the tedium
 * this editor exists to remove.
 *
 * Two round trips, because the tasks need the new quest's id and only the server
 * knows it until it answers.
 */
async function duplicateQuest(q) {
  const data = stripTypes(q.data || {});
  delete data.id;
  data.x = qx(q) + 1;
  data.y = qy(q) + 1;

  const text = {};
  const t = q.text || {};
  if (t.rawTitle) text.title = t.rawTitle;
  if (t.subtitle) text.subtitle = t.subtitle;
  if ((t.description || []).length) text.description = t.description;

  const res = await send([{ op: 'create', kind: 'quest', parent: S.chapterId, data, text }]);
  if (!res || !res.created || !res.created.length) return;
  const made = res.created[0];

  const kids = [...(q.tasks || []).map(c => childCopy('task', made, c)),
                ...(q.rewards || []).map(c => childCopy('reward', made, c))];
  if (kids.length) await send(kids);

  await reload();
  select(made, true);
}

function childCopy(kind, parent, c) {
  const data = stripTypes(c.data || {});
  delete data.id;
  delete data.type;                        // carried by the op's own type field
  const op = { op: 'create', kind, parent, type: c.typeId, data };
  if ((c.text || {}).rawTitle) op.text = { title: c.text.rawTitle };
  return op;
}

function select(id, centre = false) {
  S.sel = id;
  const f = byId(id);
  if (centre && f && f.kind === 'quest') centreOn(f.obj);
  renderPanel();
  openPanel();
  drawMap();
}

function centreOn(q) {
  const r = cv.getBoundingClientRect();
  view.x = r.width / 2 - qx(q) * view.scale;
  view.y = r.height / 2 - qy(q) * view.scale;
  drawMap();
}

const openPanel = () => $('#panel').classList.add('open');
const closePanel = () => $('#panel').classList.remove('open');

// Dismissing the dialog keeps the quest selected, so the map still shows which one
// you were on and tapping it again picks up where you left off.
$('#closePanel').onclick = () => { closePanel(); drawMap(); };
$('#panel').addEventListener('click', e => {
  if (e.target.id === 'panel') { closePanel(); drawMap(); }
});

// ----------------------------------------------------------------- edit mode --

$('#editToggle').onclick = () => {
  S.edit = !S.edit;
  S.placing = S.linking = S.linkReturn = false;
  $('#editToggle').setAttribute('aria-pressed', S.edit);
  $('#editToggle').textContent = S.edit ? 'Editing on' : 'Editing off';
  $('#tools').hidden = !S.edit;
  $('#addQuest').setAttribute('aria-pressed', 'false');
  $('#banner').hidden = true;
  renderChapters();
  if (S.sel) renderPanel();
  drawMap();
};

$('#addQuest').onclick = () => {
  S.placing = !S.placing;
  S.linking = S.linkReturn = false;
  $('#addQuest').setAttribute('aria-pressed', S.placing);
  if (S.placing) { closePanel(); banner('Tap the map to place the quest.'); }
  else $('#banner').hidden = true;
};

async function createQuest(x, y) {
  S.placing = false;
  $('#addQuest').setAttribute('aria-pressed', 'false');
  $('#banner').hidden = true;
  const res = await send([{ op: 'create', kind: 'quest', parent: S.chapterId, data: { x, y } }]);
  if (!res || !res.created || !res.created.length) return;
  await reload();
  select(res.created[0]);
  // The first thing anyone wants to do with a new quest is name it.
  const first = $('#qBody').querySelector('input[data-autofocus]');
  if (first) first.focus();
}

/**
 * Dependency mode. One quest is the subject; tapping another adds it as a
 * requirement, or removes it if it is already one. It stays on until you say
 * otherwise, because wiring a quest up is rarely one link, and it opens nothing:
 * a dialog appearing over the map after every pick is what made this unusable.
 */
function startLinking(id, fromDialog) {
  S.sel = id;
  S.linking = true;
  S.linkReturn = !!fromDialog;      // came from the dialog, so go back to it
  S.placing = false;
  $('#addQuest').setAttribute('aria-pressed', 'false');
  closePanel();
  drawMap();
  banner('Tap quests to add or remove them as requirements. Tap empty space when done.',
    false, true);
}

function endLinking() {
  if (!S.linking) return;
  S.linking = false;
  $('#banner').hidden = true;
  drawMap();
  if (S.linkReturn && S.sel) { renderPanel(); openPanel(); }
  S.linkReturn = false;
}

async function toggleDependency(id) {
  const f = selected();
  if (!f || f.kind !== 'quest') return;
  const here = Object.fromEntries(quests().map(q => [q.id, q]));
  const cur = deps(f.obj);
  const had = cur.includes(id);
  const next = had ? cur.filter(d => d !== id) : [...cur, id];

  f.obj.data.dependencies = next;
  drawMap();
  const name = titleOf(here[id]) || 'that quest';
  banner((had ? 'Removed ' : 'Added ') + name + '. Tap empty space when done.', false, true);

  await send([{ op: 'set', target: f.obj.id, path: 'data.dependencies', value: next }]);
}

// ------------------------------------------------------------------ widgets --

function field(label, el, note) {
  const d = document.createElement('div');
  d.className = 'field';
  const l = document.createElement('label');
  l.textContent = label;
  d.append(l, el);
  if (note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;
    d.append(n);
  }
  return d;
}

function readOnly(label, value) {
  const v = document.createElement('div');
  v.className = 'val';
  v.textContent = value;
  return field(label, v);
}

/**
 * Inputs commit on change, not on every keystroke: one edit per meaningful change
 * keeps the git history readable and the server quiet.
 */
function textBox(value, onCommit, opts = {}) {
  const el = document.createElement(opts.area ? 'textarea' : 'input');
  if (!opts.area) el.type = 'text';
  el.value = value == null ? '' : value;
  el.disabled = !S.edit;
  if (opts.autofocus) el.dataset.autofocus = '1';
  el.onchange = () => onCommit(el.value);
  return el;
}

function numBox(value, onCommit, step = 0.5) {
  const el = document.createElement('input');
  el.type = 'number';
  el.step = step;
  el.value = value;
  el.disabled = !S.edit;
  el.onchange = () => { if (el.value !== '') onCommit(Number(el.value)); };
  return el;
}

function checkBox(label, value, onCommit) {
  const wrap = document.createElement('label');
  wrap.className = 'check';
  const el = document.createElement('input');
  el.type = 'checkbox';
  el.checked = !!value;
  el.disabled = !S.edit;
  el.onchange = () => onCommit(el.checked);
  wrap.append(el, document.createTextNode(label));
  return wrap;
}

function selectBox(value, options, onCommit) {
  const el = document.createElement('select');
  el.disabled = !S.edit;
  for (const o of options) {
    const opt = document.createElement('option');
    const v = Array.isArray(o) ? o[0] : o;
    const text = Array.isArray(o) ? o[1] : o;
    opt.value = v;
    opt.textContent = text === '' ? '(chapter default)' : text;
    el.append(opt);
  }
  el.value = value == null ? '' : value;
  if (onCommit) el.onchange = () => onCommit(el.value);
  return el;
}

function button(label, onClick, cls = 'btn', enabled = S.edit) {
  const b = document.createElement('button');
  b.className = cls;
  b.textContent = label;
  b.onclick = onClick;
  b.disabled = !enabled;
  return b;
}

function note(text) {
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = text;
  return n;
}

/**
 * A destructive action, on its own at the end with room around it. An accordion
 * holding a single button was a disclosure that disclosed nothing.
 */
function danger(label, onClick) {
  const wrap = document.createElement('div');
  wrap.className = 'dangerzone';
  wrap.append(button(label, onClick, 'btn danger'));
  return wrap;
}

function section(name, label, count, build) {
  const d = document.createElement('details');
  d.open = S.open.has(name);
  d.ontoggle = () => d.open ? S.open.add(name) : S.open.delete(name);
  const s = document.createElement('summary');
  s.innerHTML = '<span>' + esc(label) + '</span>'
    + (count == null || count === '' ? '' : '<span class="count">' + esc(count) + '</span>');
  const inner = document.createElement('div');
  inner.className = 'inner';
  build(inner);
  d.append(s, inner);
  return d;
}

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const iconTag = id => id && S.icons[id]
  ? '<img src="/icons/' + S.icons[id].file + '" alt="">'
  : '<span class="pill">?</span>';

// ---------------------------------------------------------------- inspector --

/**
 * Only the heading, so renaming something can update it without rebuilding the
 * form underneath and throwing away the cursor.
 */
function refreshHeading() {
  const f = selected();
  if (!f) return;
  $('#qTitle').innerHTML = esc(titleOf(f.obj) || 'Untitled ' + f.kind)
    + '<span class="sub">' + esc(f.kind) + ' ' + esc(f.obj.id) + '</span>';
}

function renderPanel() {
  const f = selected();
  if (!f) { closePanel(); return; }
  const body = $('#qBody');
  body.innerHTML = '';
  refreshHeading();
  if (f.kind === 'quest') questPanel(body, f.obj);
  else if (f.kind === 'chapter') chapterPanel(body, f.obj);
  else childPanel(body, f.obj, f.kind, f.quest);
}

// --- a quest ---

/**
 * The quest form, ordered the way FTB's own editor is: what the quest *says*,
 * then what it *asks for*, then what it looks like. Position and shape come last
 * because dragging the thing on the map is how those actually get set.
 */
function questPanel(body, q) {
  const set = (path, value, type) =>
    send([{ op: 'set', target: q.id, path, value, ...(type ? { type } : {}) }]);
  const setText = (key, value) => send([{ op: 'setText', target: q.id, key, value }]);

  body.append(field('title', textBox((q.text || {}).rawTitle || '', v => {
    q.text.rawTitle = v; q.text.title = v; setText('title', v); refreshHeading(); drawMap();
  }, { autofocus: true }),
    (q.text || {}).rawTitle ? null : 'Empty: FTB shows the first task’s item name instead.'));

  body.append(field('subtitle', textBox((q.text || {}).subtitle || '', v => {
    q.text.subtitle = v; setText('subtitle', v);
  })));

  body.append(field('description',
    textBox(((q.text || {}).description || []).join('\n'), v => {
      q.text.description = v.split('\n'); setText('description', v);
    }, { area: true }),
    'One line per entry. FTB directives such as {image:…} work here.'));

  body.append(childSection(q, 'tasks', 'Tasks', S.types.tasks));
  body.append(childSection(q, 'rewards', 'Rewards', S.types.rewards));

  // --- what has to be done first ---
  const list = deps(q);
  body.append(section('deps', 'Requires first', list.length, inner => {
    const here = Object.fromEntries(quests().map(x => [x.id, x]));
    if (!list.length) inner.append(note('Nothing. This quest is available from the start.'));
    for (const id of list) {
      const dep = here[id];
      const row = document.createElement('div');
      row.className = 'item dep';
      const go = document.createElement('button');
      go.className = 't';
      // A 16-hex number tells a human nothing; the point of the panel is to read.
      go.innerHTML = dep
        ? '<b>' + esc(titleOf(dep) || 'Untitled quest') + '</b><span>' + esc(id) + '</span>'
        : '<b>Not in this chapter</b><span>' + esc(id) + '</span>';
      go.onclick = () => dep ? select(id, true) : banner('That quest is in another chapter.');
      row.append(go);
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Remove';
      x.disabled = !S.edit;
      x.onclick = () => {
        const next = list.filter(d => d !== id);
        q.data.dependencies = next;
        renderPanel(); drawMap();
        set('data.dependencies', next);
      };
      row.append(x);
      inner.append(row);
    }
    // The map is behind the dialog, so this gets out of the way and lets them tap
    // it; endLinking brings the dialog back when they are finished.
    inner.append(button('Choose on the map…', () => startLinking(q.id, true)));
  }));

  // --- how it looks ---
  body.append(section('look', 'Appearance', null, inner => {
    const row = document.createElement('div');
    row.className = 'row';
    row.append(
      field('x', numBox(qx(q), v => { q.data.x = v; set('data.x', v, 'double'); drawMap(); })),
      field('y', numBox(qy(q), v => { q.data.y = v; set('data.y', v, 'double'); drawMap(); })),
      field('size', numBox(qsize(q), v => { q.data.size = v; set('data.size', v, 'double'); drawMap(); }, 0.25))
    );
    inner.append(row);
    inner.append(field('shape', selectBox((q.data || {}).shape || '', SHAPES, v => {
      q.data.shape = v; set('data.shape', v, 'string'); drawMap();
    })));

    const current = ((q.data || {}).icon || {}).id || null;
    const shown = current && current !== 'ftbquests:custom_icon' && S.icons[current] ? current : null;
    const pick = document.createElement('button');
    pick.className = 'item';
    pick.disabled = !S.edit;
    pick.innerHTML = iconTag(shown)
      + '<div class="t"><b>' + esc(current ? 'Icon set on the quest' : 'Icon from the first task')
      + '</b><span>' + esc(current || questIconId(q) || 'none') + '</span></div>';
    pick.onclick = () => openChooser({
      label: 'Quest icon', icons: true,
      values: itemValues(), current,
      onPick: id => { q.data.icon = { id }; set('data.icon', { id }); }
    });
    inner.append(pick);
    const components = ((q.data || {}).icon || {}).components;
    if (components) inner.append(readOnly('icon components', JSON.stringify(components)));
    if (current) {
      inner.append(button('Clear, use the first task', () => {
        delete q.data.icon;
        set('data.icon', null);
      }, 'btn danger'));
    }
  }));

  body.append(section('raw', 'Advanced', null, inner =>
    dataEditor(inner, q, q.id, ['id', 'x', 'y', 'size', 'shape', 'icon', 'dependencies'])));

  body.append(danger('Delete this quest', () => {
    if (!window.confirm('Delete “' + (titleOf(q) || q.id) + '” and its tasks?')) return;
    S.sel = null; closePanel();
    send([{ op: 'delete', target: q.id }]);
  }));
}

function childSection(q, key, label, catalogue) {
  const children = q[key] || [];
  const kind = key.slice(0, -1);
  return section(key, label, children.length, inner => {
    if (!children.length) {
      inner.append(note(kind === 'task'
        ? 'No tasks, so nothing has to be done to complete this quest.'
        : 'No rewards.'));
    }
    for (const c of children) {
      const row = document.createElement('div');
      row.className = 'item dep';
      const iconId = key === 'tasks' ? taskIconId(c) : null;
      if (iconId) {
        const img = document.createElement('img');
        img.src = '/icons/' + S.icons[iconId].file;
        img.alt = '';
        row.append(img);
      }
      const go = document.createElement('button');
      go.className = 't';
      go.innerHTML = '<b>' + esc(typeLabel(c)) + '</b><span>' + esc(summarise(c)) + '</span>';
      go.onclick = () => select(c.id);
      row.append(go);
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Delete';
      x.disabled = !S.edit;
      x.onclick = () => {
        if (!window.confirm('Delete this ' + typeLabel(c) + ' ' + kind + '?')) return;
        // Take it out here and now. Waiting for the round trip left the row
        // sitting there as though the click had missed.
        const i = children.indexOf(c);
        if (i >= 0) children.splice(i, 1);
        renderPanel(); drawMap();
        send([{ op: 'delete', target: c.id }]);
      };
      row.append(x);
      inner.append(row);
    }

    const entries = Object.values(catalogue || {});
    if (!entries.length) return;
    // A searchable chooser rather than a dropdown: a pack this size has dozens of
    // task types across a dozen mods, and a <select> of those is a scroll.
    inner.append(button('+ Add ' + kind, () => openChooser({
      label: kind === 'task' ? 'Task type' : 'Reward type',
      icons: false,
      values: entries.map(t => t.id),
      describe: id => (catalogue[id] || {}).label || '',
      onPick: type => {
        send([{ op: 'create', kind, parent: q.id, type }]).then(async res => {
          if (res && res.created && res.created.length) {
            await reload();
            select(res.created[0]);
          }
        });
      }
    }), 'btn go'));
  });
}

const shortType = c => String(c.typeId || (c.data || {}).type || '?').replace(/^ftbquests:/, '');

/** The name FTB shows for the type, falling back to its id. */
function typeLabel(c) {
  const cat = (S.types.tasks || {})[c.typeId] || (S.types.rewards || {})[c.typeId];
  return (cat && cat.label) || shortType(c);
}

/** One line that says what this task or reward actually is. */
function summarise(c) {
  const d = c.data || {};
  const filter = d.item && d.item.components && d.item.components['ftbfiltersystem:filter'];
  if (filter) return filter;
  for (const k of ['item', 'fluid', 'entity', 'advancement', 'dimension', 'biome',
                   'structure', 'stage', 'stat', 'command', 'table', 'to_observe', 'scene']) {
    const v = d[k];
    if (typeof v === 'string' && v) return v;
    if (v && typeof v === 'object' && v.id) {
      return v.id + (num(d.count, 1) > 1 ? ' ×' + d.count : '');
    }
  }
  if (d.value != null) return String(d.value);
  // A freshly added task has nothing but an id and a type, and showing the id
  // tells a human nothing about what is missing.
  return Object.keys(d).some(k => k !== 'id' && k !== 'type' && k !== '$types')
    ? c.id : 'nothing set yet';
}

// --- a task or a reward ---

function childPanel(body, c, kind, quest) {
  const catalogue = (kind === 'task' ? S.types.tasks : S.types.rewards)[c.typeId];
  if (quest) {
    body.append(button('↑ Back to ' + (titleOf(quest) || 'the quest'),
      () => select(quest.id, true), 'btn', true));
  }
  body.append(readOnly('type', (catalogue && catalogue.label ? catalogue.label + '  ' : '')
    + (c.typeId || (c.data || {}).type || '?')));

  body.append(field('title',
    textBox((c.text || {}).rawTitle || '', v => {
      c.text.rawTitle = v; c.text.title = v;
      refreshHeading();
      send([{ op: 'setText', target: c.id, key: 'title', value: v }]);
    }),
    'Optional. FTB names most ' + kind + 's from their contents.'));

  // An item field is the one thing worth a real control: picking from 19,000 ids
  // by typing them is how a quest ends up asking for something that does not exist.
  const hasItem = (c.data && c.data.item !== undefined)
    || (catalogue && catalogue.fields && catalogue.fields.item);
  if (hasItem) {
    body.append(section('item', 'Item', null, inner => {
      const raw = c.data ? c.data.item : null;
      const cur = typeof raw === 'string' ? raw : (raw || {}).id;
      const pick = document.createElement('button');
      pick.className = 'item';
      pick.disabled = !S.edit;
      pick.innerHTML = iconTag(cur)
        + '<div class="t"><b>' + esc(cur || 'Nothing chosen') + '</b><span>'
        + (S.edit ? 'tap to choose from every item in the pack' : 'read only') + '</span></div>';
      pick.onclick = () => openChooser({
        label: 'Item', icons: true,
        values: itemValues(), current: cur,
        onPick: id => {
          const next = raw && typeof raw === 'object' ? { ...raw, id } : { id, count: 1 };
          c.data.item = next;
          send([{ op: 'set', target: c.id, path: 'data.item', value: next }]);
        }
      });
      inner.append(pick);

      const filter = raw && raw.components && raw.components['ftbfiltersystem:filter'];
      if (filter !== undefined) {
        inner.append(field('filter', textBox(filter, v => {
          const next = { ...raw, components: { ...raw.components, 'ftbfiltersystem:filter': v } };
          c.data.item = next;
          send([{ op: 'set', target: c.id, path: 'data.item', value: next }]);
        }), 'FTB Filter System expression. The item above is only its holder.'));
      }
    }));
  }

  body.append(section('raw', 'Settings', null, inner =>
    dataEditor(inner, c, c.id, ['id', 'type', 'item'], catalogue && catalogue.fields)));

  body.append(danger('Delete this ' + kind, () => {
    if (!window.confirm('Delete this ' + kind + '?')) return;
    const list = quest && quest[kind + 's'];
    if (list) {
      const i = list.indexOf(c);
      if (i >= 0) list.splice(i, 1);
    }
    S.sel = quest ? quest.id : null;
    renderPanel(); drawMap();
    send([{ op: 'delete', target: c.id }]);
  }));
}

// --- a chapter ---

function chapterPanel(body, c) {
  const setText = (key, value) => send([{ op: 'setText', target: c.id, key, value }]);
  body.append(field('title', textBox((c.text || {}).rawTitle || '', v => {
    c.text.rawTitle = v; c.text.title = v; setText('title', v); refreshHeading(); renderChapters();
  })));
  body.append(field('subtitle',
    textBox(((c.text || {}).subtitle || []).join('\n'), v => {
      c.text.subtitle = v.split('\n'); setText('subtitle', v);
    }, { area: true }), 'One line per entry.'));
  body.append(field('default quest shape',
    selectBox((c.data || {}).default_quest_shape || '', SHAPES, v => {
      c.data.default_quest_shape = v;
      send([{ op: 'set', target: c.id, path: 'data.default_quest_shape', value: v, type: 'string' }]);
      drawMap();
    })));
  body.append(section('raw', 'Advanced', null, inner =>
    dataEditor(inner, c, c.id, ['id', 'default_quest_shape', 'images', 'quest_links'])));
}

// --- the generic field editor ---

/**
 * Edits whatever the object happens to carry. This is the part that makes the app
 * work with every task type and every addon: the bridge reports each object's own
 * serialized fields, and the form is built from those rather than from a list
 * somebody has to keep up to date here.
 *
 * `catalogue` is the type's full field list from /types, used to offer the fields
 * FTB left out because they sit at their default — which is most of them.
 */
function dataEditor(host, obj, target, skip, catalogue) {
  const data = obj.data || {};
  const nbt = data.$types || {};
  const keys = Object.keys(data).filter(k => k !== '$types' && !skip.includes(k)).sort();
  for (const key of keys) host.append(valueField(key, data[key], nbt[key], target, obj, key));

  const missing = Object.keys(catalogue || {})
    .filter(k => !(k in data) && !skip.includes(k)).sort();
  if (!missing.length) {
    if (!keys.length) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = 'Nothing else is stored on this object.';
      host.append(n);
    }
    return;
  }

  host.append(section('unset', 'Not set', missing.length, inner => {
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'These sit at their default, so FTB does not store them. Change one and it will be.';
    inner.append(note);
    for (const key of missing) {
      const spec = catalogue[key];
      inner.append(valueField(key, spec.default, spec.type, target, obj, key));
    }
  }));
}

/**
 * Which registry a field's values come out of, keyed by the name FTB gives the
 * field.
 *
 * This is a guess about meaning — the bridge reports that a biome task has a
 * field called "biome", not that its contents are biome ids — so it only ever
 * *offers* a list. The text box underneath still accepts anything. A wrong guess
 * costs a button nobody presses; no guess at all costs a typo in a quest nobody
 * can complete.
 */
const FIELD_SOURCES = {
  biome: { registry: 'minecraft:worldgen/biome' },
  dimension: { registry: 'questbridge:dimensions' },
  entity: { registry: 'minecraft:entity_type' },
  structure: { registry: 'minecraft:worldgen/structure' },
  advancement: { registry: 'questbridge:advancements' },
  fluid: { registry: 'minecraft:fluid' },
  block: { registry: 'minecraft:block' },
  block_item: { registry: 'minecraft:item' },
  item: { registry: 'minecraft:item' },
  effect: { registry: 'minecraft:mob_effect' },
  enchantment: { registry: 'minecraft:enchantment' },
  stat: { registry: 'minecraft:custom_stat' },
  to_observe: { registry: 'minecraft:block' },
};

/** A trailing _tag means the tags of whatever the rest of the name points at. */
function sourceFor(key) {
  if (FIELD_SOURCES[key]) return FIELD_SOURCES[key];
  if (key.endsWith('_tag')) {
    const base = FIELD_SOURCES[key.slice(0, -4)];
    if (base) return { registry: base.registry, tags: true };
    if (key === 'tool_tag') return { registry: 'minecraft:item', tags: true };
  }
  return null;
}

/** An ItemStack-shaped compound: icon, block_item, item. */
function stackRow(value, key, commit) {
  const row = document.createElement('div');
  row.className = 'item';
  const draw = () => {
    row.innerHTML = iconTag(S.icons[value.id] ? value.id : null)
      + '<div class=\"t\"><b>' + esc(value.id) + '</b><span>'
      + (S.edit ? 'tap to choose' : 'read only') + '</span></div>';
  };
  draw();
  row.onclick = () => {
    if (!S.edit) return;
    openChooser({
      label: key.replace(/_/g, ' '), icons: true,
      values: itemValues(), current: value.id,
      onPick: id => { value = { ...value, id }; draw(); commit(value); }
    });
  };
  return row;
}

/** The same value as raw NBT, tucked away for the parts no control covers. */
function rawDetails(value, commit) {
  const d = document.createElement('details');
  const s = document.createElement('summary');
  s.innerHTML = '<span>Raw</span>';
  const inner = document.createElement('div');
  inner.className = 'inner';
  const el = document.createElement('textarea');
  el.value = JSON.stringify(stripTypes(value), null, 1);
  el.disabled = !S.edit;
  const err = document.createElement('div');
  err.className = 'bad';
  el.onchange = () => {
    try { const parsed = JSON.parse(el.value); err.textContent = ''; commit(parsed); }
    catch { err.textContent = 'Not valid JSON — nothing was saved.'; }
  };
  inner.append(el, err);
  d.append(s, inner);
  return d;
}

function valueField(label, value, nbtType, target, obj, key) {
  const path = 'data.' + key;
  const commit = v => {
    if (obj.data) obj.data[key] = v;
    send([{ op: 'set', target, path, value: v, ...(nbtType ? { type: nbtType } : {}) }]);
  };

  if (typeof value === 'boolean' || nbtType === 'boolean') {
    return field(label, checkBox(key, value, commit));
  }
  // A compound holding an id is an ItemStack nine times out of ten — icon,
  // block_item, the lot. Those deserve the picker, not a JSON box; the JSON stays
  // underneath for the components nothing else can edit.
  if (value && typeof value === 'object' && !Array.isArray(value)
      && typeof value.id === 'string') {
    const wrap = field(label, stackRow(value, key, commit));
    wrap.append(rawDetails(value, commit));
    return wrap;
  }
  if (value !== null && typeof value === 'object') {
    // A compound or a list, edited as JSON. Generating a form for arbitrary nested
    // NBT is a rabbit hole, and the cases that matter have real controls.
    const el = document.createElement('textarea');
    el.value = JSON.stringify(stripTypes(value), null, 1);
    el.disabled = !S.edit;
    const err = document.createElement('div');
    err.className = 'bad';
    el.onchange = () => {
      try {
        const parsed = JSON.parse(el.value);
        err.textContent = '';
        commit(parsed);
      } catch {
        err.textContent = 'Not valid JSON — nothing was saved.';
      }
    };
    const wrap = field(label + (Array.isArray(value) ? ' (list)' : ' (compound)'), el);
    wrap.append(err);
    return wrap;
  }
  if (typeof value === 'number') {
    const step = nbtType === 'double' || nbtType === 'float' ? 0.5 : 1;
    return field(label + (nbtType ? ' · ' + nbtType : ''), numBox(value, commit, step));
  }

  const source = sourceFor(key);
  if (source) return field(label, idBox(value == null ? '' : String(value), source, key, commit));
  return field(label, textBox(value == null ? '' : value, commit));
}

/**
 * A text box with the list behind it. The box still takes anything typed, because
 * the mapping from a field name to a registry is a guess and a wrong guess must
 * not lock anyone out of their own field.
 */
function idBox(value, source, key, commit) {
  const row = document.createElement('div');
  row.className = 'idrow';
  const input = textBox(value, commit);
  const browse = button('Browse', () => chooseFromRegistry(source, {
    label: (source.tags ? 'Tag for ' : '') + key.replace(/_/g, ' '),
    current: input.value,
    icons: true,
    onPick: id => { input.value = id; commit(id); }
  }), 'btn');
  row.append(input, browse);
  return row;
}

const stripTypes = v => {
  if (Array.isArray(v)) return v.map(stripTypes);
  if (v && typeof v === 'object') {
    return Object.fromEntries(Object.entries(v)
      .filter(([k]) => k !== '$types').map(([k, x]) => [k, stripTypes(x)]));
  }
  return v;
};

// ------------------------------------------------------------------ chooser --

/**
 * One dialog for picking an id, whatever kind of id it is: an item, a biome, an
 * entity, a task type. They are all namespaced ids from a list the server knows,
 * so they all deserve the same treatment — search, grouped by mod, with an icon
 * where there is one.
 *
 * Typing "minecraft:lush_caves" from memory is how a quest ends up asking for
 * something that does not exist, and this pack has hundreds of biomes that exist
 * only because some mod added them.
 */
let chooser = null;

function openChooser(opts) {
  chooser = {
    values: opts.values || [],
    onPick: opts.onPick,
    current: opts.current || null,
    describe: opts.describe || null,
    icons: opts.icons !== false,
  };
  $('#pickerTitle').textContent = opts.label || 'Choose';
  $('#picker').hidden = false;
  $('#pickerSearch').value = '';
  $('#pickerSearch').placeholder = 'Search ' + (opts.label || '').toLowerCase() + '…';
  fillMods();
  renderPicker();
  // A phone keyboard covering the list the moment it opens is not helpful.
  if (innerWidth > 640) $('#pickerSearch').focus();
}

/** Fetches a registry from the bridge once, then chooses from it. */
async function chooseFromRegistry(source, opts) {
  const key = source.registry + (source.tags ? '#tags' : '');
  let list = S.registries[key];
  if (!list) {
    try {
      const r = await api('/registry?name=' + encodeURIComponent(source.registry)
        + (source.tags ? '&tags=1' : ''));
      list = S.registries[key] = r.values || [];
    } catch {
      list = S.registries[key] = [];
    }
  }
  if (!list.length) {
    banner('The server lists nothing for ' + source.registry + '. Type the id instead.', true);
    return;
  }
  openChooser({ ...opts, values: list });
}

const closePicker = () => { $('#picker').hidden = true; chooser = null; };
$('#pickerCancel').onclick = closePicker;
$('#picker').addEventListener('click', e => { if (e.target.id === 'picker') closePicker(); });
$('#pickerSearch').addEventListener('input', () => renderPicker());
$('#pickerMod').addEventListener('change', () => renderPicker());

/** namespace -> count, for whatever the chooser is showing right now. */
function fillMods() {
  const sel = $('#pickerMod');
  const counts = new Map();
  for (const id of chooser.values) counts.set(nsOf(id), (counts.get(nsOf(id)) || 0) + 1);

  sel.innerHTML = '';
  const all = document.createElement('option');
  all.value = '';
  all.textContent = 'All mods (' + chooser.values.length.toLocaleString() + ')';
  sel.append(all);
  // Alphabetical: a list of a hundred mods is something you look a name up in,
  // not something you browse, and ranking by size moves the name you want.
  for (const ns of [...counts.keys()].sort()) {
    const o = document.createElement('option');
    o.value = ns;
    o.textContent = ns + ' (' + counts.get(ns).toLocaleString() + ')';
    sel.append(o);
  }
  sel.hidden = counts.size < 2;
}

/**
 * Too many to put in the DOM and far too many to scroll, so the result is capped.
 * Grouping by mod is what makes the cap bearable: everything from one mod arrives
 * together under its own heading, and the dropdown narrows to one mod when you
 * already know where you are going.
 */
function renderPicker() {
  const grid = $('#pickerGrid');
  grid.innerHTML = '';
  const withIcons = chooser.icons && chooser.values.some(v => S.icons[v]);
  grid.classList.toggle('aslist', !withIcons);

  const q = $('#pickerSearch').value.trim().toLowerCase();
  const only = $('#pickerMod').value;
  let hits = chooser.values;
  if (only) hits = hits.filter(id => nsOf(id) === only);
  // Match the name as well as the id: nobody searches for
  // another_furniture:oak_bench, they search for "bench".
  if (q) hits = hits.filter(id => id.toLowerCase().includes(q)
    || (S.names[id] || '').toLowerCase().includes(q));

  // Within a mod, shortest first: "oak_log" puts minecraft:oak_log above
  // stripped_oak_log, and a search for "iron" does not bury the ingot.
  const byLength = (a, b) => nameOf(a).length - nameOf(b).length || a.localeCompare(b);
  const cap = withIcons ? 300 : 220;

  if (only) {
    const take = hits.slice().sort(byLength).slice(0, cap);
