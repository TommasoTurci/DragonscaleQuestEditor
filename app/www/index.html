    for (const id of take) grid.append(tile(id, withIcons));
    count(take.length, hits.length, 1);
    return;
  }

  const groups = new Map();
  for (const id of hits) {
    const ns = nsOf(id);
    if (!groups.has(ns)) groups.set(ns, []);
    groups.get(ns).push(id);
  }
  // Mods whose own name matches what was typed first, so "create" offers Create's
  // own items before everything with create in the name. Then vanilla, which a
  // quest book reaches for most and which a mod with a dozen near-misses buries.
  const rank = ns => (q && ns.includes(q) ? 0 : ns === 'minecraft' ? 1 : 2);
  const order = [...groups.keys()].sort((a, b) =>
    rank(a) - rank(b)
    || groups.get(b).length - groups.get(a).length
    || a.localeCompare(b));

  let left = cap, shown = 0;
  for (const ns of order) {
    if (left <= 0) break;
    const items = groups.get(ns).sort(byLength);
    const head = document.createElement('div');
    head.className = 'modhead';
    head.innerHTML = esc(ns || '(no mod)') + '<span>' + items.length + '</span>';
    grid.append(head);
    const take = items.slice(0, Math.min(left, withIcons ? 60 : 40));
    for (const id of take) grid.append(tile(id, withIcons));
    shown += take.length;
    left -= take.length;
  }
  count(shown, hits.length, order.length);
}

function tile(id, withIcons) {
  const b = document.createElement('button');
  if (id === chooser.current) b.className = 'current';
  const icon = S.icons[id];
  if (withIcons) {
    b.innerHTML = (icon ? '<img src="/icons/' + icon.file + '" alt="" loading="lazy">'
                        : '<span class="pill">?</span>')
      + '<span>' + esc(S.names[id] || nameOf(id)) + '</span>';
  } else {
    const extra = chooser.describe ? chooser.describe(id) : '';
    b.innerHTML = '<b>' + esc(S.names[id] || nameOf(id)) + '</b>'
      + (extra ? '<span>' + esc(extra) + '</span>' : '');
  }
  b.title = id;
  b.onclick = () => { const f = chooser.onPick; closePicker(); if (f) f(id); };
  return b;
}

const nsOf = id => (id.includes(':') ? id.slice(0, id.indexOf(':')) : '');
const nameOf = id => (id.includes(':') ? id.slice(id.indexOf(':') + 1) : id);

function count(shown, total, groups) {
  $('#pickerCount').textContent = shown < total
    ? shown.toLocaleString() + ' of ' + total.toLocaleString() + ' shown'
      + (groups > 1 ? ' across ' + groups + ' mods' : '')
      + ' — keep typing, or pick a mod'
    : total.toLocaleString() + (total === 1 ? ' match' : ' matches')
      + (groups > 1 ? ' in ' + groups + ' mods' : '');
}

// ------------------------------------------------------------------ history --

const closeHistory = () => { $('#history').hidden = true; };
$('#histClose').onclick = closeHistory;
$('#histOpen').onclick = openHistory;
$('#history').addEventListener('click', e => { if (e.target.id === 'history') closeHistory(); });

async function openHistory() {
  $('#history').hidden = false;
  const list = $('#histList');
  list.innerHTML = '';
  $('#histNote').textContent = 'Reading the history…';

  let h;
  try {
    h = await api('/history');
  } catch (e) {
    $('#histNote').textContent = 'Could not read the history: ' + e.message;
    return;
  }
  if (!h.enabled) {
    $('#histNote').textContent = 'The bridge found no quest folder to keep a history in, '
      + 'so nothing has been recorded.';
    return;
  }

  (h.commits || []).forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'commit' + (i === 0 ? ' now' : '');
    const t = document.createElement('div');
    t.className = 't';
    t.innerHTML = '<b>' + esc(c.message) + '</b><span>' + esc(when(c.when)) + ' · '
      + esc(c.author) + ' · ' + esc(c.id.slice(0, 8)) + '</span>';
    row.append(t);
    // The newest commit is where the book already is, so a Restore button on it
    // would be a dangerous-looking no-op.
    if (i > 0) row.append(button('Restore', () => restoreTo(c), 'btn danger'));
    list.append(row);
  });

  const snaps = h.snapshots || [];
  $('#histNote').textContent = !(h.commits || []).length
    ? 'Nothing committed yet. The first edit starts the history.'
    : (S.edit
        ? 'Restoring puts the book back and tells everyone. It is itself a commit, so it '
          + 'can be undone the same way.'
        : 'Turn Editing on to restore to one of these.')
      + (snaps.length ? ' Full copies kept on the server: ' + snaps.slice(0, 3).join(', ') + '.' : '');
}

/** "2026-10-20T01:14:09+02:00" is not something to read at a glance. */
function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  if (mins < 60 * 24) return Math.round(mins / 60) + ' h ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

async function restoreTo(c) {
  if (!window.confirm('Put the whole book back to “' + c.message + '”?\n\n'
      + 'Everything since then is undone, for everyone. The current state is kept, '
      + 'so this can be undone too.')) return;
  closeHistory();
  S.saving++; status();
  try {
    await api('/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ commit: c.id })
    });
    S.sel = null; closePanel();
    await reload();
    fitView(); drawMap();
    banner('Restored to “' + c.message + '”');
  } catch (e) {
    banner(e.message || 'The restore failed.', true);
  } finally {
    S.saving--; status();
  }
}

// ------------------------------------------------------------- item browser --

/**
 * The half of the workflow the editor was missing.
 *
 * Composing a quest book means scrolling the creative menu, finding an item,
 * looking up how it is made, and writing a quest around that. All of it happened
 * in the game, in JEI, in another window. The server knows every item it has
 * registered and every recipe it loaded, so it may as well answer here.
 *
 * Items come from the server's item registry rather than from the icon index,
 * because the icon index is built by walking model files and those include
 * things that are not items at all — minecraft:bow_pulling_0 is a model for a
 * bow being drawn, and no quest can ask for one. The index supplies the picture;
 * the registry decides what exists; the name table built from the mod jars
 * supplies the word a human would use.
 */
let browsing = null;      // null = the list, otherwise the item being looked at

$('#browseOpen').onclick = () => openBrowse();
$('#browseClose').onclick = () => { $('#browse').hidden = true; };
$('#browseBack').onclick = () => { browsing = null; renderBrowse(); };
$('#browse').addEventListener('click', e => { if (e.target.id === 'browse') $('#browse').hidden = true; });
$('#browseSearch').addEventListener('input', () => { if (!browsing) renderBrowse(); });
$('#browseMod').addEventListener('change', () => { if (!browsing) renderBrowse(); });

async function openBrowse(item) {
  $('#browse').hidden = false;
  browsing = item || null;
  $('#browseCount').textContent = 'Loading…';
  await loadItems();
  fillBrowseMods();
  renderBrowse();
  if (!browsing && innerWidth > 640) $('#browseSearch').focus();
}

/**
 * The item list, from the server, once. Falls back to the icon index if the
 * bridge is too old to answer — which costs some entries that are not really
 * items, and is better than an empty browser.
 */
async function loadItems() {
  if (S.items) return S.items;
  try {
    const r = await api('/registry?name=minecraft:item');
    S.items = (r.values || []).length ? r.values : Object.keys(S.icons);
  } catch {
    S.items = Object.keys(S.icons);
  }
  return S.items;
}

const displayName = id => S.names[id] || nameOf(id).replace(/_/g, ' ');

/**
 * Every item the server has registered, which is not the same as every item the
 * icon builder found a model for: minecraft:bow_pulling_0 is a model for a bow
 * being drawn, not something a quest can ask for.
 */
const itemValues = () => S.items || Object.keys(S.icons);

function fillBrowseMods() {
  const sel = $('#browseMod');
  if (sel.options.length) return;
  const counts = new Map();
  for (const id of S.items) counts.set(nsOf(id), (counts.get(nsOf(id)) || 0) + 1);
  const all = document.createElement('option');
  all.value = '';
  all.textContent = 'All mods (' + S.items.length.toLocaleString() + ')';
  sel.append(all);
  for (const ns of [...counts.keys()].sort()) {
    const o = document.createElement('option');
    o.value = ns;
    o.textContent = ns + ' (' + counts.get(ns).toLocaleString() + ')';
    sel.append(o);
  }
}

function renderBrowse() {
  $('#browseBack').hidden = !browsing;
  if (browsing) return renderDetail(browsing);

  $('#browseTitle').textContent = 'Items';
  const body = $('#browseBody');
  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.id = 'browseGrid';
  body.append(grid);

  const q = $('#browseSearch').value.trim().toLowerCase();
  const only = $('#browseMod').value;
  let hits = S.items;
  if (only) hits = hits.filter(id => nsOf(id) === only);
  // Searching by name is the point: nobody looks for another_furniture:oak_bench,
  // they look for "bench".
  if (q) hits = hits.filter(id => id.toLowerCase().includes(q)
    || displayName(id).toLowerCase().includes(q));

  const sorted = hits.slice().sort((a, b) =>
    displayName(a).length - displayName(b).length || a.localeCompare(b));
  const shown = sorted.slice(0, 360);

  for (const id of shown) {
    const b = document.createElement('button');
    const icon = S.icons[id];
    b.innerHTML = (icon ? '<img src="/icons/' + icon.file + '" alt="" loading="lazy">'
                        : '<span class="pill">?</span>')
      + '<b>' + esc(displayName(id)) + '</b>'
      + '<span>' + esc(nsOf(id)) + '</span>';
    b.title = id;
    b.onclick = () => { browsing = id; renderBrowse(); };
    grid.append(b);
  }
  $('#browseCount').textContent = shown.length < hits.length
    ? shown.length.toLocaleString() + ' of ' + hits.length.toLocaleString()
      + ' — keep typing, or pick a mod'
    : hits.length.toLocaleString() + (hits.length === 1 ? ' item' : ' items');
}

// --- one item, with its recipes ---

// --- one item, with everything known about it ---

async function renderDetail(id) {
  $('#browseTitle').textContent = displayName(id);
  const body = $('#browseBody');
  body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'detail';
  body.append(wrap);

  const hero = document.createElement('div');
  hero.className = 'hero';
  const icon = S.icons[id];
  hero.innerHTML = (icon ? '<img src="/icons/' + icon.file + '" alt="">'
                         : '<span class="pill">?</span>')
    + '<div><h3>' + esc(displayName(id)) + '</h3>'
    + '<div class="id">' + esc(id) + '</div></div>';
  wrap.append(hero);

  // Which mod it came from, in that mod's author's own words. Short, but it is
  // the one description of a mod certain to be accurate, and it is usually the
  // difference between "what is this" and "oh, it is a Create thing".
  const modId = nsOf(id);
  if (S.mods[modId]) wrap.append(modCard(modId));

  // What the game itself thinks this is. c:ingots/steel says more about an item
  // than most sentences would, and it is the server's own answer, not a guess.
  const info = document.createElement('div');
  wrap.append(info);

  const noteBox = document.createElement('div');
  noteBox.className = 'field';
  wrap.append(noteBox);

  const acts = document.createElement('div');
  acts.className = 'acts';
  const sel = selected();
  if (S.edit && sel && sel.kind === 'quest') {
    acts.append(button('Add as a task to “' + (titleOf(sel.obj) || 'this quest') + '”',
      () => addItemTask(sel.obj.id, id), 'btn go'));
  }
  if (S.edit) acts.append(button('New quest for this item', () => newQuestForItem(id), 'btn'));
  if (!S.edit) acts.append(note('Turn Editing on to build a quest from this.'));
  wrap.append(acts);

  const where = document.createElement('div');
  where.textContent = 'Looking up recipes…';
  where.className = 'empty';
  wrap.append(where);
  $('#browseCount').textContent = '';

  // Tags and the saved note come from the bridge together.
  api('/item?id=' + encodeURIComponent(id)).then(meta => {
    if (browsing !== id) return;
    const tags = meta.tags || [];
    if (tags.length) {
      const t = document.createElement('div');
      t.innerHTML = '<h4>Tags</h4>';
      const row = document.createElement('div');
      row.className = 'tags';
      for (const tag of tags.slice(0, 24)) {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = tag;
        row.append(s);
      }
      if (tags.length > 24) row.append(Object.assign(document.createElement('span'),
        { className: 'tag', textContent: '+' + (tags.length - 24) }));
      t.append(row);
      info.append(t);
    }
    S.notes[id] = meta.note || '';
    renderNote(noteBox, id);
  }).catch(() => renderNote(noteBox, id));

  let data;
  try {
    data = await api('/recipes?item=' + encodeURIComponent(id));
  } catch {
    where.textContent = 'The server could not look up recipes. It may be running an older bridge.';
    return;
  }
  if (browsing !== id) return;            // they moved on while it loaded
  where.remove();

  wrap.append(recipeList('Made by', data.makes || [], id,
    'Nothing in the pack makes this. It is found, dropped, or given.'));
  wrap.append(recipeList('Used in', data.uses || [], id,
    'Nothing in the pack uses this as an ingredient.'));
  $('#browseCount').textContent = (data.makes || []).length + ' making, '
    + (data.uses || []).length + ' using — out of ' + (data.total || 0).toLocaleString()
    + ' recipes loaded';
}

/**
 * The note: what this thing actually is, in a sentence or two.
 *
 * Writing a tutorial book is mostly working that out one item at a time, and it
 * is worth keeping the moment it is worked out rather than retyping it into
 * every quest that needs it. Which is also why it can be dropped straight into a
 * quest's description.
 */
function renderNote(host, id) {
  host.innerHTML = '';
  const label = document.createElement('label');
  label.textContent = 'what it is';
  host.append(label);

  const text = S.notes[id] || '';
  const el = document.createElement('textarea');
  el.value = text;
  el.rows = 3;
  el.placeholder = S.edit
    ? 'What is this, and what is it for? Saved against the item, not the quest.'
    : 'Nothing written yet.';
  el.disabled = !S.edit;
  el.onchange = () => {
    S.notes[id] = el.value;
    api('/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, text: el.value }) })
      .then(() => banner('Saved.'))
      .catch(e => banner(e.message || 'Could not save that note.', true));
  };
  host.append(el);

  const sel = selected();
  if (S.edit && text && sel && sel.kind === 'quest') {
    host.append(button('Use as the description of “'
      + (titleOf(sel.obj) || 'this quest') + '”', () => {
      const q = sel.obj;
      q.text.description = text.split('\n');
      send([{ op: 'setText', target: q.id, key: 'description', value: text }]);
      banner('Set as the quest description.');
    }, 'btn'));
  }
}

/**
 * Which mod an item came from, and what that mod is.
 *
 * Two layers. The mod's own `neoforge.mods.toml` description is certain but
 * usually a slogan — "Technology that empowers the player" — so it sits
 * underneath. On top goes a written summary with a link to the mod's actual
 * documentation, which is the thing that tells you what you are looking at.
 *
 * These are notes for whoever is writing the book, not quest text: a player
 * never sees them.
 */
function modCard(modId) {
  const mod = S.mods[modId] || { name: modId };
  const card = document.createElement('div');
  card.className = 'modcard';

  const head = document.createElement('div');
  head.className = 'mhead';
  head.innerHTML = '<b>' + esc(mod.name) + '</b>'
    + '<span class="mid">' + esc(modId) + '</span>';
  card.append(head);

  const written = S.notes['mod:' + modId] || '';
  const wiki = S.notes['modurl:' + modId] || '';

  const p = document.createElement('p');
  p.textContent = written || mod.description || 'Nothing written about this mod yet.';
  if (!written) p.classList.add('faint');
  card.append(p);

  // The mod's own description, kept visible underneath once something better
  // has been written over it, because the two can disagree and the author's is
  // the one that is certainly about this version.
  if (written && mod.description) {
    const own = document.createElement('p');
    own.className = 'faint small';
    own.textContent = '“' + mod.description + '” — the mod’s own blurb';
    card.append(own);
  }

  const links = document.createElement('div');
  links.className = 'mlinks';
  for (const [href, label] of [[wiki, 'wiki'], [mod.url, 'page']]) {
    if (!href) continue;
    const a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noreferrer';
    a.textContent = label + ': ' + shortUrl(href);
    links.append(a);
  }
  if (links.children.length) card.append(links);

  if (S.edit) {
    const edit = document.createElement('details');
    const s = document.createElement('summary');
    s.innerHTML = '<span>edit mod notes</span>';
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.append(field('about the mod', textBox(written,
      v => saveNote('mod:' + modId, v, () => renderBrowse()), { area: true })));
    inner.append(field('wiki or docs link', textBox(wiki,
      v => saveNote('modurl:' + modId, v, () => renderBrowse()))));
    edit.append(s, inner);
    card.append(edit);
  }
  return card;
}

function saveNote(key, text, after) {
  S.notes[key] = text;
  return api('/note', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: key, text })
  }).then(() => { banner('Saved.'); if (after) after(); })
    .catch(e => banner(e.message || 'Could not save that.', true));
}

const shortUrl = u => String(u).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');

function recipeList(label, list, subject, emptyText) {
  const sec = document.createElement('div');
  const h = document.createElement('h4');
  h.textContent = label + (list.length ? ' (' + list.length + ')' : '');
  sec.append(h);
  if (!list.length) {
    sec.append(Object.assign(document.createElement('div'),
      { className: 'empty', textContent: emptyText }));
    return sec;
  }
  const box = document.createElement('div');
  box.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:6px';
  for (const r of list) box.append(recipeRow(r, subject));
  sec.append(box);
  return sec;
}

/**
 * How a recipe is laid out, read off the recipe's own JSON.
 *
 * JEI draws a modded recipe with a plugin written for that mod: code that knows
 * a milling recipe has a millstone and where on the screen to put it. None of
 * that is data the server holds, so it cannot be fetched — but it turns out most
 * of it does not need to be. Processing recipes across Create and the mods that
 * follow it agree on their key names: `ingredients`, `results`, `chance`,
 * `processing_time`, `heat_requirement`. Reading those gets the chances and the
 * timings — the part that matters when you are writing a tutorial quest — for
 * every mod that follows the convention, including ones nobody has looked at.
 *
 * Where a type is genuinely shaped differently it gets an entry below. That is a
 * line of data, not a plugin.
 */
const numOr = (v, dflt) => (typeof v === 'number' ? v : dflt);

const RECIPE_SHAPES = {
  'create:sequenced_assembly': 'sequence',
};

const HEAT = { none: '', heated: 'Heated', superheated: 'Superheated' };

function recipeRow(r, subject) {
  const row = document.createElement('div');
  row.className = 'recipe';

  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = String(r.type || '?')
    .replace(/^minecraft:crafting_/, '').replace(/^minecraft:/, '');
  kind.title = r.id || '';
  row.append(kind);

  const flow = document.createElement('div');
  flow.className = 'flow';
  row.append(flow);

  if (RECIPE_SHAPES[r.type] === 'sequence' && r.raw) {
    flow.append(sequenceView(r, subject));
  } else {
    flow.append(inputsView(r, subject));
    flow.append(arrowView(r));
    flow.append(outputsView(r, subject));
  }

  if (r.raw) row.append(rawView(r.raw));
  return row;
}

// --- the three parts of an ordinary recipe ---

function inputsView(r, subject) {
  const box = document.createElement('div');
  box.className = 'side';
  if (r.grid) {
    // The shape of a shaped recipe is the point of it. Blank slots come over as
    // empty lists so the pattern survives the trip.
    const g = document.createElement('div');
    g.className = 'grid';
    g.style.gridTemplateColumns = 'repeat(' + r.grid.w + ', var(--slot))';
    for (const slot of r.inputs) g.append(slot.length ? slotTile(slot, subject) : slotTile([], subject));
    box.append(g);
    return box;
  }
  const fluids = fluidInputs(r.raw);
  if (!(r.inputs || []).length && !fluids.length) {
    box.innerHTML = '<span class="none">inputs not readable</span>';
    return box;
  }
  for (const slot of r.inputs || []) box.append(slotTile(slot, subject));
  for (const f of fluids) box.append(fluidTile(f));
  return box;
}

function arrowView(r) {
  const box = document.createElement('div');
  box.className = 'mid';
  const cook = r.time != null && /smelt|blast|smok|campfire|cook/.test(r.type || '');
  if (cook) box.innerHTML = '<img class="flame" src="/icons/ui/flame.png" alt="">';
  box.innerHTML += '<img class="arrow" src="/icons/ui/'
    + (cook ? 'cook_arrow.png' : 'arrow.png') + '" alt="→">';

  // Whatever the recipe says about itself that a picture cannot: how long it
  // takes, and whether it has to be hot.
  const bits = [];
  const time = r.time != null ? r.time : numOr((r.raw || {}).processing_time, null);
  if (time != null && time > 0) bits.push((time / 20).toFixed(time % 20 ? 1 : 0) + 's');
  if (r.xp) bits.push(r.xp + ' xp');
  const heat = (r.raw || {}).heat_requirement;
  if (heat && HEAT[heat]) bits.push(HEAT[heat]);
  if ((r.raw || {}).loops > 1) bits.push('×' + r.raw.loops + ' loops');
  if (bits.length) {
    const m = document.createElement('span');
    m.className = 'meta';
    m.textContent = bits.join(' · ');
    box.append(m);
  }
  return box;
}

function outputsView(r, subject) {
  const box = document.createElement('div');
  box.className = 'side';
  const extra = chancedResults(r.raw);
  if (extra.length) {
    for (const o of extra) box.append(slotTile([o.id], subject, o));
    return box;
  }
  if (r.output) box.append(slotTile([r.output.id], subject, { count: r.output.count }));
  for (const f of fluidResults(r.raw)) box.append(fluidTile(f));
  return box;
}

// --- reading the raw JSON generically ---

/** Results with a chance or a count, as Create and its neighbours write them. */
function chancedResults(raw) {
  const list = raw && Array.isArray(raw.results) ? raw.results : [];
  return list
    .filter(o => o && typeof o.id === 'string')
    .map(o => ({ id: o.id, count: numOr(o.count, 1), chance: numOr(o.chance, 1) }));
}

const fluidResults = raw => fluidsIn(raw && raw.results);
const fluidInputs = raw => fluidsIn(raw && (raw.ingredients || (raw.ingredient ? [raw.ingredient] : [])));

function fluidsIn(list) {
  if (!Array.isArray(list)) return [];
  return list
    .filter(o => o && typeof o === 'object' && (o.fluid || o.amount != null) && !o.id)
    .map(o => ({ fluid: o.fluid || o.fluid_tag || '?', amount: numOr(o.amount, null) }));
}

// --- sequenced assembly, which is genuinely a different shape ---

function sequenceView(r, subject) {
  const box = document.createElement('div');
  box.className = 'sequence';

  const head = document.createElement('div');
  head.className = 'side';
  const start = (r.raw.ingredient || {}).item || (r.raw.ingredient || {}).id;
  if (start) head.append(slotTile([start], subject));
  head.append(arrowImg());
  for (const o of chancedResults(r.raw)) head.append(slotTile([o.id], subject, o));
  if (r.raw.loops > 1) {
    const m = document.createElement('span');
    m.className = 'meta';
    m.textContent = '×' + r.raw.loops + ' loops';
    head.append(m);
  }
  box.append(head);

  const steps = Array.isArray(r.raw.sequence) ? r.raw.sequence : [];
  for (const [i, step] of steps.entries()) {
    const line = document.createElement('div');
    line.className = 'step';
    const n = document.createElement('span');
    n.className = 'kind';
    n.textContent = (i + 1) + '. ' + String(step.type || '?').replace(/^create:/, '');
    line.append(n);
    // The transitional item is in every step's ingredients and says nothing;
    // what matters is the one thing being added.
    for (const ing of step.ingredients || []) {
      if (ing && (ing.fluid || ing.fluid_tag)) {
        line.append(fluidTile({ fluid: ing.fluid || ing.fluid_tag, amount: numOr(ing.amount, null) }));
        continue;
      }
      const id = ing.item || ing.id || (ing.tag ? '#' + ing.tag : null);
      if (!id || id === start) continue;
      line.append(slotTile([String(id).replace(/^#/, '')], subject));
    }
    if (line.children.length === 1) {
      // A step with nothing added to it — pressing, for instance — still has to
      // read as a step rather than as a label with a bug behind it.
      const n = document.createElement('span');
      n.className = 'meta';
      n.textContent = 'nothing added';
      line.append(n);
    }
    box.append(line);
  }
  return box;
}

const arrowImg = () => {
  const i = document.createElement('img');
  i.className = 'arrow';
  i.src = '/icons/ui/arrow.png';
  i.alt = '→';
  return i;
};

// --- slots ---

/**
 * One slot, on Minecraft's own slot texture. A slot driven by a tag accepts many
 * items; showing the first with a count beside it is what a recipe book does,
 * and the whole list is in the tooltip for when it matters.
 */
function slotTile(ids, subject, extra) {
  const el = document.createElement('button');
  el.className = 'slot';
  if (!ids.length) { el.classList.add('blank'); el.disabled = true; return el; }

  const pick = ids.includes(subject) ? subject : ids[0];
  const icon = S.icons[pick];
  el.innerHTML = (icon ? '<img src="/icons/' + icon.file + '" alt="">'
                       : '<span class="pill">?</span>')
    + (ids.length > 1 ? '<span class="more">+' + (ids.length - 1) + '</span>' : '');
  if (extra && extra.count > 1) {
    el.innerHTML += '<span class="count">' + extra.count + '</span>';
  }
  if (extra && extra.chance != null && extra.chance < 1) {
    el.innerHTML += '<span class="chance">' + Math.round(extra.chance * 100) + '%</span>';
  }
  el.title = ids.map(displayName).join(', ')
    + (extra && extra.chance < 1 ? ' — ' + Math.round(extra.chance * 100) + '% chance' : '');
  el.onclick = () => { browsing = pick; renderBrowse(); };
  return el;
}

function fluidTile(f) {
  const el = document.createElement('div');
  el.className = 'slot fluid';
  el.innerHTML = '<span class="fl">' + esc(nameOf(String(f.fluid))) + '</span>'
    + (f.amount ? '<span class="count">' + f.amount + '</span>' : '');
  el.title = f.fluid + (f.amount ? ' ×' + f.amount + ' mB' : '');
  return el;
}

function rawView(raw) {
  const d = document.createElement('details');
  d.className = 'rawrecipe';
  const s = document.createElement('summary');
  s.innerHTML = '<span>recipe json</span>';
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(raw, null, 1);
  d.append(s, pre);
  return d;
}


// --- turning an item into a quest ---

async function addItemTask(questId, item) {
  const res = await send([{ op: 'create', kind: 'task', parent: questId,
    type: 'ftbquests:item', data: { item: { id: item, count: 1 } } }]);
  if (!res) return;
  banner('Added ' + displayName(item) + ' to the quest.');
  await reload();
  if (S.sel === questId && !panelHasFocus()) renderPanel();
}

/**
 * A quest for this item, in one step: placed where you are looking, named after
 * the item, asking for one of it. Renaming it is the next thing anyone does, so
 * the dialog opens on the title.
 */
async function newQuestForItem(item) {
  const r = cv.getBoundingClientRect();
  const [wx, wy] = toWorld(r.width / 2, r.height / 2);
  const res = await send([{
    op: 'create', kind: 'quest', parent: S.chapterId,
    data: { x: snap(wx), y: snap(wy) },
    text: { title: displayName(item) }
  }]);
  if (!res || !res.created || !res.created.length) return;
  const made = res.created[0];
  await send([{ op: 'create', kind: 'task', parent: made,
    type: 'ftbquests:item', data: { item: { id: item, count: 1 } } }]);
  $('#browse').hidden = true;
  await reload();
  select(made, true);
  const first = $('#qBody').querySelector('input[data-autofocus]');
  if (first) first.focus();
}

// --------------------------------------------------------------------- keys --

addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea,select')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) { closeMenu(); return; }
    if (!$('#browse').hidden) { $('#browse').hidden = true; return; }
    if (!$('#picker').hidden) { closePicker(); return; }
    if (!$('#history').hidden) { closeHistory(); return; }
    if (S.linking) { endLinking(); return; }
    if (S.placing) {
      S.placing = false;
      $('#addQuest').setAttribute('aria-pressed', 'false');
      $('#banner').hidden = true;
      return;
    }
    if ($('#panel').classList.contains('open')) { closePanel(); drawMap(); return; }
    S.sel = null; drawMap();
    return;
  }
  if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    $('#editToggle').click();
  }
});
</script>
